      - generic [ref=f2e343]:
        - generic [ref=f2e344]:
          - paragraph [ref=f2e345]: I learn a stack by shipping something with it.
          - paragraph [ref=f2e346]: Samarth Rachcha
          - link "Fourteen public repositories" [ref=f2e347] [cursor=pointer]:
            - /url: https://github.com/SamarthRachcha
        - generic [ref=f2e352]:
          - paragraph [ref=f2e353]: "Most of what I know came from taking a question all the way to a running thing: a notebook that had to become an API, a model that had to survive a dashboard, a classifier that had to be explained to someone else."
          - paragraph [ref=f2e354]: The projects here are uneven on purpose. Some are written from scratch to understand the math — the digit recogniser is NumPy forward passes and hand-derived gradients. Others lean on a pre-trained model because the interesting part was the pipeline around it.
          - paragraph [ref=f2e355]: "The through-line is finishing: a baseline to compare against, a file someone else can re-run, and an interface that does not need a README to operate."
