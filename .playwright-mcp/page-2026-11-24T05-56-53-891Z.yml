          - paragraph [ref=f7e257]: Five stages, each a script you can run on its own. The forecast is only as good as the counts that feed it.
        - generic [ref=f7e259]:
          - generic [ref=f7e260]:
            - text: "01"
            - heading "Start with the baseline" [level=3] [ref=f7e261]
            - paragraph [ref=f7e262]: The crowd forecaster is measured against a day-of-week and hour-of-day average before the LSTM gets any credit. If the simple thing wins, say so.
          - generic [ref=f7e263]:
            - text: "02"
            - heading "Keep the data path visible" [level=3] [ref=f7e264]
            - paragraph [ref=f7e265]: Frames become counts, counts become a time series, the series becomes a forecast. Every step is a file you can inspect and re-run.
          - generic [ref=f7e266]:
            - text: "03"
            - heading "Finish the interface" [level=3] [ref=f7e267]
            - paragraph [ref=f7e268]: A model that only exists in a notebook is half a project. I ship the dashboard, the API, or the chat UI that puts it in someone's hands.
