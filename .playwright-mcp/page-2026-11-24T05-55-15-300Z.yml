            - text: "01"
            - heading "Start with the baseline" [level=3] [ref=f5e274]
            - paragraph [ref=f5e275]: The crowd forecaster is measured against a day-of-week and hour-of-day average before the LSTM gets any credit. If the simple thing wins, say so.
          - generic [ref=f5e276]:
            - text: "02"
            - heading "Keep the data path visible" [level=3] [ref=f5e277]
            - paragraph [ref=f5e278]: Frames become counts, counts become a time series, the series becomes a forecast. Every step is a file you can inspect and re-run.
          - generic [ref=f5e279]:
