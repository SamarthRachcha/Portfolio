      - generic [ref=f4e364]:
        - generic [ref=f4e365]:
          - generic [ref=f4e366]:
            - paragraph [ref=f4e367]: I learn a stack by shipping something with it.
            - paragraph [ref=f4e368]: Samarth Rachcha
            - link "samarth.rachcha@gmail.com" [ref=f4e369] [cursor=pointer]:
              - /url: mailto:samarth.rachcha@gmail.com
          - generic [ref=f4e374]:
            - paragraph [ref=f4e375]: I'm a computer science student in Pune, working where machine learning meets the browser. My projects usually start with a question I cannot answer from a tutorial — how do you count a crowd from a fixed camera, how do you build a digit classifier without a framework — and end with an API or a dashboard in front of them.
            - paragraph [ref=f4e376]: "I like the unglamorous middle: cleaning a 1.5-million-row reviews table, checking whether the LSTM actually beats a day-of-week average, keeping the dashboard alive when the model is slow to load. That work is most of the job, and it is the part I find interesting."
            - paragraph [ref=f4e377]: "Most recently I was a game developer trainee at Firebird VR, building in Unity and C#. The through-line across all of it is finishing: a baseline to compare against, a file someone else can re-run, and an interface that does not need a README to operate."
