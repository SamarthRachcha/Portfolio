        - generic [ref=e364]:
          - paragraph [ref=e365]: "Most of what I know came from taking a question all the way to a running thing: a notebook that had to become an API, a model that had to survive a dashboard, a classifier that had to be explained to someone else."
          - paragraph [ref=e366]: The projects here are uneven on purpose. Some are written from scratch to understand the math — the digit recogniser is NumPy forward passes and hand-derived gradients. Others lean on a pre-trained model because the interesting part was the pipeline around it.
          - paragraph [ref=e367]: "The through-line is finishing: a baseline to compare against, a file someone else can re-run, and an interface that does not need a README to operate."
