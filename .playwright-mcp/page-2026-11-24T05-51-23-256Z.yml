            - heading "Start with the baseline" [level=3] [ref=f3e272]
            - paragraph [ref=f3e273]: The crowd forecaster is measured against a day-of-week and hour-of-day average before the LSTM gets any credit. If the simple thing wins, say so.
          - generic [ref=f3e274]:
            - text: "02"
            - heading "Keep the data path visible" [level=3] [ref=f3e275]
            - paragraph [ref=f3e276]: Frames become counts, counts become a time series, the series becomes a forecast. Every step is a file you can inspect and re-run.
          - generic [ref=f3e277]:
