      - generic [ref=f3e354]:
        - generic [ref=f3e355]:
          - paragraph [ref=f3e356]: I learn a stack by shipping something with it.
          - paragraph [ref=f3e357]: Samarth Rachcha
          - link "Fourteen public repositories" [ref=f3e358] [cursor=pointer]:
            - /url: https://github.com/SamarthRachcha
        - generic [ref=f3e363]:
          - paragraph [ref=f3e364]: "Most of what I know came from taking a question all the way to a running thing: a notebook that had to become an API, a model that had to survive a dashboard, a classifier that had to be explained to someone else."
          - paragraph [ref=f3e365]: The projects here are uneven on purpose. Some are written from scratch to understand the math — the digit recogniser is NumPy forward passes and hand-derived gradients. Others lean on a pre-trained model because the interesting part was the pipeline around it.
          - paragraph [ref=f3e366]: "The through-line is finishing: a baseline to compare against, a file someone else can re-run, and an interface that does not need a README to operate."
