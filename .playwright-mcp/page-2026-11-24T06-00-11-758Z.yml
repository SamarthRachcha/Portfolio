          - paragraph [ref=f11e257]: Five stages, each a script you can run on its own. The forecast is only as good as the counts that feed it.
        - generic [ref=f11e259]:
          - generic [ref=f11e260]:
            - text: "01"
            - heading "Start with the baseline" [level=3] [ref=f11e261]
            - paragraph [ref=f11e262]: The crowd forecaster is measured against a day-of-week and hour-of-day average before the LSTM gets any credit. If the simple thing wins, say so.
          - generic [ref=f11e263]:
            - text: "02"
            - heading "Keep the data path visible" [level=3] [ref=f11e264]
            - paragraph [ref=f11e265]: Frames become counts, counts become a time series, the series becomes a forecast. Every step is a file you can inspect and re-run.
          - generic [ref=f11e266]:
