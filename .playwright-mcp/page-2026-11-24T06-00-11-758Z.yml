      - generic [ref=f11e350]:
        - generic [ref=f11e351]:
          - generic [ref=f11e352]:
            - paragraph [ref=f11e353]: I learn a stack by shipping something with it.
            - paragraph [ref=f11e354]: Samarth Rachcha
            - link "samarth.rachcha@gmail.com" [ref=f11e355] [cursor=pointer]:
              - /url: mailto:samarth.rachcha@gmail.com
          - generic [ref=f11e360]:
            - paragraph [ref=f11e361]: I'm a computer science student in Pune, working where machine learning meets the browser. My projects usually start with a question I cannot answer from a tutorial — how do you count a crowd from a fixed camera, how do you build a digit classifier without a framework — and end with an API or a dashboard in front of them.
            - paragraph [ref=f11e362]: "I like the unglamorous middle: cleaning a 1.5-million-row reviews table, checking whether the LSTM actually beats a day-of-week average, keeping the dashboard alive when the model is slow to load. That work is most of the job, and it is the part I find interesting."
            - paragraph [ref=f11e363]: "Most recently I was a game developer trainee at Firebird VR, building in Unity and C#. The through-line across all of it is finishing: a baseline to compare against, a file someone else can re-run, and an interface that does not need a README to operate."
